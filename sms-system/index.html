      <div class="inner-wrapper">
        <div class="inner-content">
          <div class="amount-to-pay">
            <div class="summary">
              <div>
                <div style="padding-bottom: 8px;">Amount to pay</div>
                <div style="font-size: 18px; font-weight: 700; line-height: 18px;">KES 4,200.00</div>
              </div>
            </div>
          </div>

          <form id="vendorFieldsForm">
            <div class="mobile">
              <div style="font-size: 16px; font-weight: 700; line-height: 16px; margin-bottom: 16px;">
                Enter your details to continue
              </div>

              <div>
                <input type="tel" id="mobile_number" name="mobile_number" placeholder="Mobile Number" required>
              </div>

              <div style="margin-top: 16px;">
                <input type="text" id="smartcard_number" name="smartcard_number" placeholder="Smartcard Number" required>
              </div>

              <div class="button-contatiner" style="margin-top: 24px;">
                <button type="submit" id="submitBtn">Continue</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('vendorFieldsForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const loader = document.getElementById('loading');
      
      const mobileNumber = document.getElementById('mobile_number').value;
      const smartcardNumber = document.getElementById('smartcard_number').value;

      btn.disabled = true;
      loader.style.display = 'block';

      try {
        const response = await fetch('/api/send-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mobile_number: mobileNumber,
            smartcard_number: smartcardNumber
          })
        });

        const result = await response.json();

        if (result.success) {
          alert('Notification SMS sent successfully!');
        } else {
          alert('Failed to send SMS: ' + (result.message || 'Error occurred'));
        }
      } catch (err) {
        alert('Network error. Unable to reach server.');
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    });
  </script>
